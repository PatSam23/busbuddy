plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
    // Swagger/OpenAPI plugin for generating documentation
    id 'org.springdoc.openapi-gradle-plugin' version '1.8.0'
}

group = 'com.application'
version = '0.0.1-SNAPSHOT'

// ✅ Updated to Java 21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'io.github.cdimascio:dotenv-java:2.2.4'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JWT - Updated versions
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Swagger/OpenAPI 3 for API documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.3.0'
    // For security integration with Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-common:2.3.0'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'  // For testing

    // Optional: TestContainers for integration tests
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    // Cloudinary for image upload and management
    implementation 'com.cloudinary:cloudinary-http44:1.34.0'

    // For enhanced multipart file handling (optional, Spring Boot handles basic multipart)
    implementation 'commons-fileupload:commons-fileupload:1.5'

    // JSON processing (likely already included, but ensuring it's available)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}

// ✅ Configure compiler for Java 21
tasks.withType(JavaCompile) {
    options.release = 21
}

// ✅ Test configuration
test {
    useJUnitPlatform()
    jvmArgs '--enable-preview'  // If you want to use preview features
}

// ✅ Spring Boot configuration
tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-jammy-base:latest'
}

// ✅ OpenAPI/Swagger configuration
openApi {
    apiDocsUrl = "http://localhost:8080/v3/api-docs"
    outputDir = file("$buildDir/docs")
    outputFileName = "openapi.json"
    waitTimeInSeconds = 30
}